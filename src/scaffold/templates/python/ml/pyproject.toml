[project]
name = "__PROJECT__"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.5", "joblib>=1.4"]

[project.scripts]
train = "__PACKAGE__.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "jupyterlab>=4.2"]

[tool.ruff]
line-length = 100
