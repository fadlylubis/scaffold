[project]
name = "scaffold"
version = "0.1.0"
description = "Personal project scaffolding for Python (uv), Go and Vue."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
scaffold = "scaffold.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
